<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨堂小測驗</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: #0077be; text-align: center; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .question { margin-bottom: 20px; }
        button { width: 100%; padding: 12px; background-color: #0077be; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #005f96; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>隨堂小測驗</h1>
    
    <div class="input-group">
        <label for="studentName">學生姓名：</label>
        <input type="text" id="studentName" placeholder="請輸入姓名">
    </div>

    <div class="question">
        <p>1. 台灣最高的山是哪一座？</p>
        <input type="radio" name="q1" value="阿里山"> 阿里山<br>
        <input type="radio" name="q1" value="玉山"> 玉山<br>
        <input type="radio" name="q1" value="陽明山"> 陽明山
    </div>

    <div class="question">
        <p>2. 水的三態中，固態稱為什麼？</p>
        <input type="radio" name="q2" value="冰"> 冰<br>
        <input type="radio" name="q2" value="水蒸氣"> 水蒸氣<br>
        <input type="radio" name="q2" value="雲"> 雲
    </div>

    <button id="submitBtn" onclick="calculateScore()">送出並看成績</button>

    <div id="result"></div>
</div>

<script>
    async function calculateScore() {
        const name = document.getElementById('studentName').value;
        const q1 = document.querySelector('input[name="q1"]:checked');
        const q2 = document.querySelector('input[name="q2"]:checked');
        const resultDiv = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');

        if (!name || !q1 || !q2) {
            alert("請確認姓名與所有題目都已填寫完畢！");
            return;
        }

        let score = 0;
        if (q1.value === "玉山") score += 50;
        if (q2.value === "冰") score += 50;

        resultDiv.style.display = "block";
        resultDiv.style.backgroundColor = score === 100 ? "#d4edda" : "#f8d7da";
        resultDiv.innerHTML = `${name} 同學，測驗成績：${score} 分。<br>正在與雲端伺服器溝通...`;

        const scriptUrl = 'https://script.google.com/macros/s/AKfycbzHc6AmYQ3UJ69O0kjgwykE4sXXjR95pHEywWHyXsmzy3e5pqt-znzKdCUVQh7kh_FZ/exec';
        
        try {
            // 使用 application/json 發送並等待回應
            const response = await fetch(scriptUrl, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, score: score })
            });
            
            const data = await response.json();
            resultDiv.innerHTML += `<br>伺服器回應：${data.message}`;
        } catch (error) {
            resultDiv.innerHTML += "<br>錯誤：無法寫入試算表。請確認 GAS 已執行「部署」並設定為「所有人」。";
            console.error("傳送錯誤:", error);
        }
        
        submitBtn.disabled = true;
    }
</script>

</body>
</html>
